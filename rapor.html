<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Rapor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Jost', Arial, sans-serif;
    background: #16211a;
    color: #f0ece2;
    margin: 0;
    padding: 40px 20px;
  }
  .box { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #c9a961;
    font-size: 2rem;
    margin-bottom: 4px;
  }
  .sub { color: #999; margin-bottom: 24px; font-size: 0.9rem; }
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    margin: 18px 0 8px; font-size: 0.82rem; color: #bbb;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .ball-group {
    margin-top: 22px; margin-bottom: 4px;
  }
  .ball-group-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #1e2b23; border: 1px solid #3a4a3d; border-radius: 8px 8px 0 0;
    font-size: 1.05rem;
  }
  .ball-group-count {
    background: #c9a961; color: #14201a; font-weight: 700; font-size: 0.85rem;
    padding: 2px 9px; border-radius: 10px;
  }
  .ball-group-note { color: #999; font-size: 0.8rem; margin-left: auto; }
  .ball-group-empty {
    color: #777; font-size: 0.85rem; padding: 12px 14px;
    border: 1px solid #3a4a3d; border-top: none; border-radius: 0 0 8px 8px; margin-bottom: 4px;
  }
  .noise-flag {
    display: block; font-size: 0.72rem; color: #e0a878; background: #3f2a2a;
    padding: 1px 6px; border-radius: 8px; margin-top: 4px; width: fit-content;
  }
  .gate {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=password] {
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #3a4a3d;
    background: #1e2b23;
    color: #fff;
    width: 240px;
  }
  button {
    padding: 12px 24px;
    background: #c9a961;
    color: #16211a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover { background: #ddbf7a; }
  .err { color: #e88; margin-top: 12px; width: 100%; }
  .loading { color: #999; margin-top: 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.86rem; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #2a352d;
    vertical-align: top;
  }
  th { color: #c9a961; font-weight: 600; }
  tr:hover { background: #1e2b23; }
  .meta { color: #999; font-size: 0.85rem; margin-top: 18px; }
  .refresh-btn {
    padding: 8px 16px; font-size: 0.85rem; background: transparent;
    border: 1px solid #c9a961; color: #c9a961; margin-top: 16px;
  }
  .refresh-btn:hover { background: #c9a96122; }
  .oneri { color: #ddbf7a; font-weight: 500; }
  .status-label { font-size: 0.78rem; color: #999; margin-top: 4px; display: block; }
  .disclaimer {
    margin-top: 20px; padding: 12px 14px; background: #1e2b23;
    border-left: 3px solid #c9a961; font-size: 0.8rem; color: #999;
  }

  .dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 3px;
    vertical-align: middle;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .dot-yellow { background: #e8c547; }
  .dot-green  { background: #4caf7a; }
  .dot-pink   { background: #e87fa8; }
  .dot-cancel { background: #e05c5c; }
  .dot-confirm{ background: #4caf7a; border-color: #fff; }
  .dot-cancel, .dot-confirm { border-radius: 3px; }

  .merge-badge {
    display: inline-block;
    background: #3a4a3d;
    color: #c9a961;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    cursor: pointer;
    vertical-align: middle;
    user-select: none;
  }
  .merge-badge:hover { background: #4a5c4d; }
  .other-subjects {
    display: none;
    font-size: 0.75rem;
    color: #888;
    margin-top: 4px;
    line-height: 1.5;
  }
  .other-subjects.open { display: block; }
  .other-subjects div { padding: 1px 0; }

  /* SKORBORD (06.08.2026 eklendi): en üstte iki ayrı, bağımsız açılır-kapanır buton -
     biri onaylı, biri iptal olan talepler için, spor skoru gibi sayı gösteriyor. */
  .scoreboard {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 18px 0;
  }
  .score-btn {
    flex: 1;
    min-width: 220px;
    padding: 16px 20px;
    background: #1e2b23;
    border: 1px solid #3a4a3d;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }
  .score-btn:hover { background: #24322a; }
  .score-btn .label { font-size: 0.95rem; color: #ccc; display: flex; align-items: center; gap: 8px; }
  .score-btn .count {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.8rem;
    font-weight: 600;
  }
  .score-btn.confirm .count { color: #4caf7a; }
  .score-btn.cancel .count { color: #e05c5c; }
  .score-btn .arrow { font-size: 0.8rem; color: #777; transition: transform 0.15s; margin-left: 10px; }
  .score-btn.open .arrow { transform: rotate(90deg); }
  .score-section { display: none; margin-bottom: 8px; }
  .score-section.open { display: block; }

  /* Sekmeler (10.08.2026 eklendi) - Talep Raporu / Fiyat Arama */
  .tabs { display: none; gap: 8px; margin: 18px 0 20px; border-bottom: 1px solid #2a352d; }
  .tab-btn {
    background: transparent; border: none; color: #999; padding: 10px 18px;
    font-size: 0.95rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
    border-radius: 0; margin-bottom: -1px;
  }
  .tab-btn:hover { background: transparent; color: #ddd; }
  .tab-btn.active { color: #c9a961; border-bottom: 2px solid #c9a961; }
  .search-form {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px;
  }
  .search-field { display: flex; flex-direction: column; gap: 4px; }
  .search-field label { font-size: 0.78rem; color: #999; }
  .search-field input, .search-field select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #3a4a3d;
    background: #1e2b23; color: #fff; font-size: 0.92rem; width: 140px;
  }
  .search-note { color: #ddbf7a; font-size: 0.85rem; margin-bottom: 12px; }
  .email-analyze-box {
    border: 1px solid #3a4a3d; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px;
    background: #1e2b23; display: flex; flex-direction: column; gap: 8px;
  }
  .email-analyze-box label { font-size: 0.78rem; color: #999; }
  .email-analyze-box textarea {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #3a4a3d;
    background: #14201a; color: #fff; font-size: 0.9rem; font-family: inherit; resize: vertical;
  }
  .email-analyze-box button {
    align-self: flex-start; padding: 9px 18px; border-radius: 8px; border: none;
    background: #c9a961; color: #14201a; font-weight: 600; cursor: pointer; font-size: 0.88rem;
  }
  .email-analyze-box button:disabled { opacity: 0.6; cursor: default; }
  #s-analyze-status { font-size: 0.82rem; color: #7fcf9a; min-height: 1.1em; }
  #s-analyze-status.err { color: #e08a8a; }
  .badge-free {
    display: inline-block; font-size: 0.7rem; background: #2a3f2f; color: #7fcf9a;
    padding: 1px 6px; border-radius: 8px; margin-right: 4px;
  }
  .rounds-deficit {
    display: inline-block; font-size: 0.72rem; background: #3f2a2a; color: #e0a878;
    padding: 1px 6px; border-radius: 8px; margin-left: 4px; white-space: nowrap;
  }
  .noise-candidate {
    border: 1px solid #3a4a3d; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px;
    background: #1e2b23;
  }
  .noise-candidate label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .noise-candidate input[type="checkbox"] { width: 16px; height: 16px; }
  .noise-subject { color: #ccc; font-size: 0.88rem; margin-top: 4px; margin-left: 24px; }
  .noise-reason { color: #ddbf7a; font-size: 0.82rem; margin-top: 4px; margin-left: 24px; }

  /* Otel/Oda Tipi seçim akordiyonları (10.08.2026 eklendi) */
  .hotel-accordion, .view-accordion {
    border: 1px solid #3a4a3d; border-radius: 8px; margin-bottom: 16px;
    background: #1e2b23; overflow: hidden;
  }
  .hotel-accordion-header, .view-accordion-header {
    padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; user-select: none; font-size: 0.9rem; color: #ddd;
  }
  .hotel-accordion-header:hover, .view-accordion-header:hover { background: #24322a; }
  .hotel-accordion-header .arrow, .view-accordion-header .arrow { color: #c9a961; transition: transform 0.15s; }
  .hotel-accordion-header.open .arrow, .view-accordion-header.open .arrow { transform: rotate(90deg); }
  .hotel-accordion-body, .view-accordion-body {
    display: none; padding: 12px 16px 16px; border-top: 1px solid #2a352d;
  }
  .hotel-accordion-body.open, .view-accordion-body.open { display: block; }
  .hotel-accordion-actions, .view-accordion-actions { margin-bottom: 10px; display: flex; gap: 14px; }
  .hotel-accordion-actions a, .view-accordion-actions a { color: #c9a961; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  .hotel-checkbox-grid, .view-checkbox-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px 16px;
  }
  .hotel-checkbox-item, .view-checkbox-item {
    display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: #ddd;
  }
  .hotel-checkbox-item input, .view-checkbox-item input { width: 16px; height: 16px; }

  /* Kampanya gösterimi (10.08.2026 eklendi) */
  .campaign-card {
    border: 1px solid #3a4a3d; border-radius: 8px; padding: 14px 16px;
    margin-bottom: 10px; background: #1e2b23;
  }
  .campaign-card.active { border-color: #4caf7a; }
  .campaign-card.inactive { opacity: 0.55; }
  .campaign-card .hotel-name { font-weight: 600; color: #fff; font-size: 0.95rem; }
  .campaign-card .discount { color: #4caf7a; font-weight: 700; font-size: 1.1rem; margin-left: 8px; }
  .campaign-card .details { color: #999; font-size: 0.82rem; margin-top: 4px; }
  .campaign-status {
    display: inline-block; font-size: 0.72rem; padding: 1px 8px; border-radius: 10px;
    margin-left: 8px; vertical-align: middle;
  }
  .campaign-status.active { background: #2a3f2f; color: #7fcf9a; }
  .campaign-status.inactive { background: #3a2a2a; color: #cf8080; }
  .watch-card {
    border: 1px dashed #3a4a3d; border-radius: 8px; padding: 12px 16px;
    margin-bottom: 8px; background: transparent; color: #999; font-size: 0.85rem;
  }
  .watch-card .hotel-name { color: #ccc; font-weight: 600; }
  .price-original { text-decoration: line-through; color: #888; font-size: 0.85em; }
  .price-campaign { color: #4caf7a; font-weight: 700; display: block; }
  .price-campaign-badge {
    display: inline-block; font-size: 0.65rem; background: #2a3f2f; color: #7fcf9a;
    padding: 0px 5px; border-radius: 6px; margin-left: 4px;
  }

  /* Stop/Open Sale sekmesi (10.08.2026 eklendi) */
  .sale-badge {
    display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 9px;
    border-radius: 10px;
  }
  .sale-badge.stop { background: #3a2020; color: #e88; }
  .sale-badge.open { background: #1e3a24; color: #7fcf9a; }
  .sale-badge.both { background: #3a3520; color: #ddbf7a; }
  .sale-badge.other { background: #2a2a2a; color: #999; }
  .date-group-header {
    margin: 10px 0 0; padding: 10px 12px; background: #1e2b23; border-radius: 6px;
    border-left: 3px solid #c9a961; color: #c9a961; font-weight: 600; font-size: 0.95rem;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .date-group-header:hover { background: #24322a; }
  .date-group-header .arrow { transition: transform 0.15s; color: #c9a961; }
  .date-group-header.open .arrow { transform: rotate(90deg); }
  .date-group-body { display: none; margin-bottom: 4px; }
  .date-group-body.open { display: block; }
</style>
</head>
<body>
<div class="box">
  <h1>Belka Golf — İç Panel</h1>
  <div class="sub">Talep Raporu ve Otel+Golf Fiyat Arama</div>

  <div id="gate" class="gate">
    <input type="password" id="pw" placeholder="Şifre" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Giriş</button>
  </div>
  <div class="err" id="err"></div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" id="tab-btn-rapor" onclick="switchTab('rapor')">Talep Raporu</button>
    <button class="tab-btn" id="tab-btn-search" onclick="switchTab('search')">Fiyat Arama</button>
    <button class="tab-btn" id="tab-btn-campaigns" onclick="switchTab('campaigns')">Kampanyalar</button>
    <button class="tab-btn" id="tab-btn-stopsale" onclick="switchTab('stopsale')">Stop/Open Sale</button>
    <button class="tab-btn" id="tab-btn-noise" onclick="switchTab('noise')">Gürültü Kontrolü</button>
  </div>

  <div id="view-rapor">
    <div id="content"></div>
  </div>

  <div id="view-search" style="display:none;">
    <div class="hotel-accordion" id="hotel-accordion">
      <div class="hotel-accordion-header" id="hotel-accordion-header" onclick="toggleHotelAccordion()">
        <span id="hotel-accordion-label">Oteller: Tümü (18)</span>
        <span class="arrow">▶</span>
      </div>
      <div class="hotel-accordion-body" id="hotel-accordion-body">
        <div class="hotel-accordion-actions">
          <a onclick="setAllHotels(true)">Tümünü Seç</a>
          <a onclick="setAllHotels(false)">Tümünü Kaldır</a>
        </div>
        <div class="hotel-checkbox-grid" id="hotel-checkbox-grid"></div>
      </div>
    </div>
    <div class="view-accordion" id="view-accordion">
      <div class="view-accordion-header" id="view-accordion-header" onclick="toggleViewAccordion()">
        <span id="view-accordion-label">Oda Tipi: Tümü</span>
        <span class="arrow">▶</span>
      </div>
      <div class="view-accordion-body" id="view-accordion-body">
        <div class="view-accordion-actions">
          <a onclick="setAllViews(true)">Tümünü Seç</a>
          <a onclick="setAllViews(false)">Tümünü Kaldır</a>
        </div>
        <div class="view-checkbox-grid" id="view-checkbox-grid"></div>
      </div>
    </div>
    <div class="email-analyze-box">
      <label>Müşteri Mailini Yapıştır (opsiyonel)</label>
      <textarea id="s-email-text" rows="5" placeholder="Müşteriden gelen talep mailini buraya yapıştırın..."></textarea>
      <button id="s-analyze-btn" onclick="analyzeEmail()">Analiz Et</button>
      <div id="s-analyze-status"></div>
    </div>
    <div class="search-form">
      <div class="search-field">
        <label>Giriş Tarihi</label>
        <input type="date" id="s-date">
      </div>
      <div class="search-field">
        <label>Gece Sayısı</label>
        <input type="number" id="s-nights" placeholder="örn. 7" min="1">
      </div>
      <div class="search-field">
        <label>Round Sayısı</label>
        <select id="s-rounds">
          <option value="">Fark etmez / Tümü</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="Sınırsız">Sınırsız</option>
        </select>
      </div>
      <div class="search-field">
        <label>Kişi Sayısı</label>
        <input type="number" id="s-pax" placeholder="2" min="1" value="2">
      </div>
      <button onclick="runHotelSearch()">Ara</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div id="view-campaigns" style="display:none;">
    <div class="meta" id="campaigns-meta">Yükleniyor...</div>
    <div id="campaigns-body"></div>
  </div>

  <div id="view-stopsale" style="display:none;">
    <div class="meta" id="stopsale-meta">Yükleniyor...</div>
    <button class="refresh-btn" onclick="loadStopSale()">Yenile</button>
    <div id="stopsale-body"></div>
  </div>

  <div id="view-noise" style="display:none;">
    <div class="meta" id="noise-meta">Henüz taranmadı.</div>
    <button class="refresh-btn" onclick="scanNoise()">Son 8 Günü Tara</button>
    <div id="noise-body"></div>
    <div id="noise-actions" style="display:none; margin-top:16px;">
      <button class="refresh-btn" onclick="confirmNoise()">Seçilenleri Gürültüye Ekle</button>
      <div id="noise-action-status" style="margin-top:8px; font-size:0.85rem;"></div>
    </div>
  </div>
</div>

<script>
const DOT_LABEL = {
  yellow: 'sarı', green: 'yeşil', pink: 'pembe', cancel: 'iptal', confirm: 'onay'
};

// Şifre girişten sonra hem rapor hem fiyat-arama sekmesi tarafından kullanılıyor.
let SAVED_PW = '';

async function doLogin() {
  SAVED_PW = document.getElementById('pw').value;
  await loadReport();
  // loadReport hata vermediyse (401/err boşsa) şifre doğrudur - sekmeleri göster.
  if (!document.getElementById('err').textContent) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('tabs').style.display = 'flex';
  }
}

function switchTab(name) {
  document.getElementById('view-rapor').style.display = name === 'rapor' ? 'block' : 'none';
  document.getElementById('view-search').style.display = name === 'search' ? 'block' : 'none';
  document.getElementById('view-campaigns').style.display = name === 'campaigns' ? 'block' : 'none';
  document.getElementById('view-stopsale').style.display = name === 'stopsale' ? 'block' : 'none';
  document.getElementById('view-noise').style.display = name === 'noise' ? 'block' : 'none';
  document.getElementById('tab-btn-rapor').classList.toggle('active', name === 'rapor');
  document.getElementById('tab-btn-search').classList.toggle('active', name === 'search');
  document.getElementById('tab-btn-campaigns').classList.toggle('active', name === 'campaigns');
  document.getElementById('tab-btn-stopsale').classList.toggle('active', name === 'stopsale');
  document.getElementById('tab-btn-noise').classList.toggle('active', name === 'noise');
  if (name === 'campaigns') loadCampaigns();
  if (name === 'stopsale') loadStopSale();
}

async function scanNoise() {
  const meta = document.getElementById('noise-meta');
  const body = document.getElementById('noise-body');
  const actions = document.getElementById('noise-actions');
  meta.textContent = 'Taranıyor... (biraz sürebilir)';
  body.innerHTML = '';
  actions.style.display = 'none';

  try {
    const res = await fetch('/api/noise?password=' + encodeURIComponent(SAVED_PW));
    const data = await res.json();

    if (res.status === 401) {
      meta.textContent = 'Şifre hatalı — sayfayı yenileyip tekrar giriş yapın.';
      return;
    }
    if (data.error) {
      meta.textContent = 'Hata: ' + escapeHtml(data.error);
      return;
    }

    if (data.candidates.length === 0) {
      meta.textContent = `${data.scannedSenders} gönderici tarandı — şüpheli gürültü bulunamadı.`;
      return;
    }

    meta.textContent = `${data.scannedSenders} gönderici tarandı — ${data.candidates.length} şüpheli aday bulundu. İşaretleyip aşağıdaki butona basın.`;

    let html = '';
    data.candidates.forEach((c, i) => {
      html += `
        <div class="noise-candidate">
          <label>
            <input type="checkbox" class="noise-check" data-email="${escapeHtml(extractNoiseEmail(c.from))}">
            <strong>${escapeHtml(c.from)}</strong>
          </label>
          <div class="noise-subject">${escapeHtml(c.subject)}</div>
          <div class="noise-reason">Gerekçe: ${escapeHtml(c.reason)}</div>
        </div>`;
    });
    body.innerHTML = html;
    actions.style.display = 'block';
  } catch (e) {
    meta.textContent = 'Bağlantı hatası — tekrar deneyin.';
  }
}

function extractNoiseEmail(fromHeader) {
  const m = (fromHeader || '').match(/<([^>]+)>/);
  return m ? m[1] : fromHeader;
}

async function confirmNoise() {
  const checked = [...document.querySelectorAll('.noise-check:checked')].map((el) => el.dataset.email);
  const statusEl = document.getElementById('noise-action-status');

  if (checked.length === 0) {
    statusEl.textContent = 'Önce en az bir gönderici işaretleyin.';
    return;
  }

  statusEl.textContent = 'Kaydediliyor...';
  try {
    const res = await fetch('/api/noise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: SAVED_PW, senders: checked })
    });
    const data = await res.json();

    if (res.status === 401) {
      statusEl.textContent = 'Şifre hatalı.';
      return;
    }
    if (data.error) {
      statusEl.textContent = 'Hata: ' + escapeHtml(data.error);
      return;
    }

    statusEl.textContent = `${data.addedCount} gönderici gürültü listesine eklendi (toplam ${data.totalSenders}). GitHub'a otomatik kaydedildi, ~1 dakika içinde sistem güncellenecek.`;
    // İşaretlenenleri listeden kaldır (tekrar işaretlenmesin diye).
    document.querySelectorAll('.noise-check:checked').forEach((el) => {
      el.closest('.noise-candidate').remove();
    });
  } catch (e) {
    statusEl.textContent = 'Bağlantı hatası — tekrar deneyin.';
  }
}

async function loadStopSale() {
  const meta = document.getElementById('stopsale-meta');
  const body = document.getElementById('stopsale-body');
  meta.textContent = 'Yükleniyor...';
  body.innerHTML = '';
  try {
    const res = await fetch('/api/stopsale?password=' + encodeURIComponent(SAVED_PW));
    const data = await res.json();
    if (res.status === 401) { meta.textContent = 'Şifre hatalı — sayfayı yenileyip tekrar giriş yapın.'; return; }
    if (data.error) { meta.textContent = 'Hata: ' + escapeHtml(data.error); return; }

    meta.textContent = `Bugünden itibaren ${data.count} bildirim — otel bazlı gruplu, alfabetik sıralı`;

    if (data.items.length === 0) {
      body.innerHTML = '<div style="color:#999;margin-top:14px;">Bugünden itibaren stop/open sale bildirimi yok.</div>';
      return;
    }

    // Aynı oteli etkileyen tüm bildirimleri tek grupta topla - backend zaten
    // otelleri alfabetik sıralı veriyor, burada sadece ardışık aynı-otelli
    // satırları aynı başlık altında birleştiriyoruz.
    const groups = [];
    let currentKey = null;
    for (const it of data.items) {
      if (it.hotel !== currentKey) {
        groups.push({ key: it.hotel, items: [] });
        currentKey = it.hotel;
      }
      groups[groups.length - 1].items.push(it);
    }

    let html = '';
    groups.forEach((g, i) => {
      const gid = 'ssgrp-' + i;
      html += `<div class="date-group-header" onclick="toggleStopSaleGroup('${gid}')">
        <span>${escapeHtml(g.key)} — ${g.items.length} bildirim</span>
        <span class="arrow">▶</span>
      </div>`;
      html += `<div class="date-group-body" id="${gid}">`;
      html += '<table><tr><th>Tarih</th><th>Tip</th><th>Detay</th><th>Konu</th></tr>';
      for (const it of g.items) {
        const d = it.dateStart
          ? (it.dateStart === it.dateEnd ? it.dateStart : `${it.dateStart} – ${it.dateEnd}`)
          : '—';
        html += `<tr>
          <td>${escapeHtml(d)}</td>
          <td><span class="sale-badge ${it.type}">${SALE_LABEL[it.type] || it.type}</span></td>
          <td>${escapeHtml(it.context || '—')}</td>
          <td>${escapeHtml(it.subject)}</td>
        </tr>`;
      }
      html += '</table></div>';
    });
    body.innerHTML = html;
  } catch (e) {
    meta.textContent = 'Bağlantı hatası: ' + e.message;
  }
}

function fmtEuro(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString('tr-TR') + ' €';
}

// Kampanya fiyatı varsa: orijinal fiyat üstü çizili küçük, altında yeni
// (yeşil) kampanyalı fiyat + rozet. Yoksa sadece normal fiyat.
function fmtPriceCell(original, campaignPrice, badgeHtml) {
  if (original === null || original === undefined) return '—';
  if (campaignPrice !== null && campaignPrice !== undefined && campaignPrice !== original) {
    return `<span class="price-original">${fmtEuro(original)}</span>` +
      `<span class="price-campaign">${fmtEuro(campaignPrice)}${badgeHtml}</span>`;
  }
  return fmtEuro(original);
}

async function analyzeEmail() {
  const text = document.getElementById('s-email-text').value.trim();
  const statusEl = document.getElementById('s-analyze-status');
  const btn = document.getElementById('s-analyze-btn');
  statusEl.classList.remove('err');

  if (!text) {
    statusEl.classList.add('err');
    statusEl.textContent = 'Önce mail metnini yapıştırın.';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Analiz ediliyor...';

  try {
    const res = await fetch('/api/analyze-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: SAVED_PW, text })
    });
    const data = await res.json();

    if (res.status === 401) {
      statusEl.classList.add('err');
      statusEl.textContent = 'Şifre hatalı — sayfayı yenileyip tekrar giriş yapın.';
      return;
    }
    if (data.error) {
      statusEl.classList.add('err');
      statusEl.textContent = 'Analiz başarısız oldu — bilgileri elle girebilirsiniz.';
      return;
    }

    const filled = [];
    if (data.date) { document.getElementById('s-date').value = data.date; filled.push('tarih'); }
    if (data.nights) { document.getElementById('s-nights').value = data.nights; filled.push('gece'); }
    if (data.rounds) {
      const roundsSelect = document.getElementById('s-rounds');
      const val = String(data.rounds);
      if ([...roundsSelect.options].some(o => o.value === val)) {
        roundsSelect.value = val;
        filled.push('round');
      }
    }
    if (data.pax) { document.getElementById('s-pax').value = data.pax; filled.push('kişi sayısı'); }

    if (filled.length === 0) {
      statusEl.textContent = 'Mailden net bir bilgi çıkarılamadı — kutucukları elle doldurun.';
    } else {
      let msg = 'Dolduruldu: ' + filled.join(', ') + '. Lütfen kontrol edip "Ara"ya basın.';
      if (data.hotel) msg += ' (Belirtilen otel: ' + data.hotel + ')';
      statusEl.textContent = msg;
    }
  } catch (e) {
    statusEl.classList.add('err');
    statusEl.textContent = 'Bağlantı hatası — tekrar deneyin.';
  } finally {
    btn.disabled = false;
  }
}

async function runHotelSearch() {
  const date = document.getElementById('s-date').value;
  const nights = document.getElementById('s-nights').value;
  const rounds = document.getElementById('s-rounds').value;
  const pax = document.getElementById('s-pax').value;
  const box = document.getElementById('search-results');

  const selectedHotels = getSelectedHotels();
  const selectedViews = getSelectedViews();
  if (selectedHotels.length === 0) {
    box.innerHTML = '<div class="err">En az bir otel seçili olmalı.</div>';
    return;
  }
  if (selectedViews.length === 0) {
    box.innerHTML = '<div class="err">En az bir oda tipi seçili olmalı.</div>';
    return;
  }
  if (!date) {
    box.innerHTML = '<div class="err">Giriş tarihi zorunlu.</div>';
    return;
  }
  box.innerHTML = '<div class="loading">Aranıyor...</div>';

  try {
    const params = new URLSearchParams({ password: SAVED_PW, date });
    if (nights) params.set('nights', nights);
    if (rounds) params.set('rounds', rounds);
    if (pax) params.set('pax', pax);
    if (selectedHotels.length < ALL_HOTELS.length) {
      params.set('hotels', selectedHotels.join('|'));
    }
    if (selectedViews.length < ALL_VIEWS.length) {
      params.set('views', selectedViews.join('|'));
    }

    const res = await fetch('/api/hotelsearch?' + params.toString());
    const data = await res.json();

    if (res.status === 401) {
      box.innerHTML = '<div class="err">Şifre hatalı — sayfayı yenileyip tekrar giriş yapın.</div>';
      return;
    }
    if (data.error) {
      box.innerHTML = '<div class="err">Hata: ' + escapeHtml(data.error) + '</div>';
      return;
    }

    let html = '';
    if (data.fallbackNote) {
      html += `<div class="search-note">⚠️ ${escapeHtml(data.fallbackNote)}</div>`;
    }
    html += `<div class="meta">${data.count} sonuç — en ucuzdan pahalıya sıralı</div>`;

    if (data.results.length === 0) {
      html += '<div style="color:#999;margin-top:14px;">Bu tarih için hiçbir otelde uygun paket bulunamadı.</div>';
    } else {
      html += '<table><tr><th>Otel</th><th>Görünüm</th><th>Gece</th><th>Round</th><th>Tekil</th><th>Çift/Kişi</th><th>7+1/Kişi</th><th>Dahil</th></tr>';
      for (const r of data.results) {
        const badges = [
          r.buggyFree ? '<span class="badge-free">Buggy</span>' : '',
          r.tokenFree ? '<span class="badge-free">Token</span>' : '',
          r.transferFree ? '<span class="badge-free">Transfer</span>' : ''
        ].join('');
        const badgeHtml = r.campaignDiscountPercent
          ? `<span class="price-campaign-badge" title="${escapeHtml(r.campaignSource || '')}">%${r.campaignDiscountPercent} EB</span>` : '';
        html += `<tr>
          <td>${escapeHtml(r.hotel)}</td>
          <td>${escapeHtml(r.view || '—')}</td>
          <td>${r.nights}</td>
          <td>${escapeHtml(String(r.rounds))}${r.roundsDeficit ? ` <span class="rounds-deficit">+${r.roundsDeficit} round gerekli</span>` : ''}</td>
          <td>${fmtPriceCell(r.single, r.campaignSingle, badgeHtml)}</td>
          <td>${fmtPriceCell(r.double, r.campaignDouble, badgeHtml)}</td>
          <td>${fmtPriceCell(r.group71, r.campaignGroup71, badgeHtml)}</td>
          <td>${badges || '—'}</td>
        </tr>`;
      }
      html += '</table>';
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="err">Bağlantı hatası: ' + escapeHtml(e.message) + '</div>';
  }
}

function isConfirmed(item) {
  return (item.statusLabel || '').indexOf('Kabul Edildi') === 0;
}
function isCancelled(item) {
  return (item.statusLabel || '').indexOf('Reddedildi') === 0;
}

// "Top kimde" - aktif (onaylanmamış/iptal edilmemiş) bir talebin iz dizisindeki SON renk,
// o an sırayı kimin beklediğini gösterir. sarı=bize geldi (bizim cevaplamamız gerek),
// yeşil=biz otele gönderdik (otel bekleniyor), pembe=biz müşteriye gönderdik (müşteri bekleniyor).
function ballCategory(item) {
  const last = item.trail && item.trail.length ? item.trail[item.trail.length - 1] : null;
  if (last === 'yellow') return 'bizde';
  if (last === 'green') return 'otelde';
  if (last === 'pink') return 'musteride';
  return 'bizde'; // beklenmeyen durum - güvenli varsayım
}

function buildRow(item, rowIdx) {
  // Saat eklendi (10.08.2026) - hangi mailin önce geldiğini ayırt etmek için tarihin
  // yanında saat de gösteriliyor artık.
  const d = item.date ? new Date(item.date).toLocaleDateString('tr-TR') + ' ' + new Date(item.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
  const lateStyle = item.isLate ? ' style="background:rgba(224,92,92,0.1);border-left:3px solid #e05c5c;"' : '';

  const mergeCount = item.mergedCount || 1;
  let mergeBadge = '';
  let otherSubjectsHtml = '';
  if (mergeCount > 1) {
    const othersId = 'others-' + rowIdx;
    mergeBadge = `<span class="merge-badge" onclick="toggleOther('${othersId}')" title="Tıkla: diğer ${mergeCount - 1} mail'i göster/gizle">×${mergeCount}</span>`;
    if (item.otherSubjects && item.otherSubjects.length) {
      otherSubjectsHtml = `<div class="other-subjects" id="${othersId}">${
        item.otherSubjects.map(s => '<div>· ' + escapeHtml(s) + '</div>').join('')
      }</div>`;
    }
  }

  const noiseBadge = item.isNoise
    ? '<span class="noise-flag" title="Claude bu talebi olası gürültü olarak işaretledi - gerçek bir müşteri/otel talebi değilse Gürültü Kontrolü sekmesinden kalıcı olarak ekleyebilirsiniz">⚠ Muhtemelen gürültü</span>'
    : '';

  return `<tr${lateStyle}>
    <td>${d}</td>
    <td>${escapeHtml(item.from)}</td>
    <td>${escapeHtml(item.subject)}${mergeBadge}${otherSubjectsHtml}${noiseBadge}</td>
    <td>${escapeHtml(item.snippet).slice(0, 120)}${item.snippet.length > 120 ? '…' : ''}</td>
    <td>${renderTrail(item.trail)}<span class="status-label">${escapeHtml(item.statusLabel)}</span></td>
    <td class="oneri">${escapeHtml(item.oneri)}</td>
  </tr>`;
}

function buildTable(items, startIdx) {
  let rowIdx = startIdx;
  let html = '<table><tr><th>Tarih / Saat</th><th>Kimden</th><th>Konu</th><th>Özet</th><th>İz / Durum</th><th>Öneri</th></tr>';
  for (const item of items) {
    rowIdx++;
    html += buildRow(item, 'r' + rowIdx);
  }
  html += '</table>';
  return { html, nextIdx: rowIdx };
}

async function loadReport() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const content = document.getElementById('content');
  err.textContent = '';
  content.innerHTML = '<div class="loading">Yükleniyor...</div>';

  try {
    const res = await fetch('/api/rapor?password=' + encodeURIComponent(pw));
    const data = await res.json();

    if (res.status === 401) {
      err.textContent = 'Şifre hatalı.';
      content.innerHTML = '';
      return;
    }
    if (data.error) {
      err.textContent = 'Hata: ' + data.error;
      content.innerHTML = '';
      return;
    }

    // SKORBORD (06.08.2026): onaylı ve iptal olan talepler ayrı ayrı sayılıp, en üstte
    // iki bağımsız skor butonu olarak gösteriliyor - her biri kendi listesini açar.
    const confirmedItems = data.items.filter(isConfirmed);
    const cancelledItems = data.items.filter(isCancelled);
    const activeItems = data.items.filter(it => !isConfirmed(it) && !isCancelled(it));

    let rowCounter = 0;

    let html = `<div class="meta">Son güncelleme: ${new Date(data.generatedAt).toLocaleString('tr-TR')}
      — ${data.count} talep bulundu — en öncelikli üstte</div>`;
    html += '<button class="refresh-btn" onclick="loadReport()">Yenile</button>';

    // Skorbord
    html += `<div class="scoreboard">
      <div class="score-btn confirm" id="score-btn-confirm" onclick="toggleScore('confirm')">
        <span class="label"><span class="dot dot-confirm"></span> Onaylı</span>
        <span class="count">${confirmedItems.length}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="score-btn cancel" id="score-btn-cancel" onclick="toggleScore('cancel')">
        <span class="label"><span class="dot dot-cancel"></span> İptal</span>
        <span class="count">${cancelledItems.length}</span>
        <span class="arrow">▶</span>
      </div>
    </div>`;

    const confirmedTable = buildTable(confirmedItems, rowCounter);
    rowCounter = confirmedTable.nextIdx;
    html += `<div class="score-section" id="score-section-confirm">${confirmedTable.html}</div>`;

    const cancelledTable = buildTable(cancelledItems, rowCounter);
    rowCounter = cancelledTable.nextIdx;
    html += `<div class="score-section" id="score-section-cancel">${cancelledTable.html}</div>`;

    html += `<div class="legend">
      <span class="legend-item"><span class="dot dot-yellow"></span> bize gelen (top bizde)</span>
      <span class="legend-item"><span class="dot dot-green"></span> biz → otel (top otelde)</span>
      <span class="legend-item"><span class="dot dot-pink"></span> biz → müşteri (top müşteride)</span>
      <span class="legend-item"><span class="merge-badge">×N</span> aynı müşterinin N mail'i birleşti — tıkla, aç/kapa</span>
    </div>`;

    // "Top kimde" gruplaması (29.08.2026) - tek karışık liste yerine üç ayrı bölüm:
    // Bizde (biz cevaplamalıyız) / Otelde (otel bekleniyor) / Müşteride (müşteri bekleniyor).
    // Her grup içinde sıra korunuyor (backend zaten tarihe göre yeniden eskiye sıralı döndürüyor).
    const groups = { bizde: [], otelde: [], musteride: [] };
    for (const it of activeItems) {
      groups[ballCategory(it)].push(it);
    }

    const GROUP_META = {
      bizde: { title: 'Bizde', dot: 'yellow', note: 'Bu taleplere bizim cevap vermemiz gerekiyor' },
      otelde: { title: 'Otelde', dot: 'green', note: 'Otelden yanıt bekleniyor' },
      musteride: { title: 'Müşteride', dot: 'pink', note: 'Müşteriden yanıt bekleniyor' }
    };

    for (const key of ['bizde', 'otelde', 'musteride']) {
      const meta = GROUP_META[key];
      const groupItems = groups[key];
      html += `<div class="ball-group">
        <div class="ball-group-header">
          <span class="dot dot-${meta.dot}"></span>
          <strong>${meta.title}</strong>
          <span class="ball-group-count">${groupItems.length}</span>
          <span class="ball-group-note">${meta.note}</span>
        </div>
      </div>`;
      const groupTable = buildTable(groupItems, rowCounter);
      rowCounter = groupTable.nextIdx;
      if (groupItems.length === 0) {
        html += '<div class="ball-group-empty">— Bu kategoride bekleyen talep yok —</div>';
      } else {
        html += groupTable.html;
      }
    }

    if (activeItems.length === 0) {
      html += '<div style="color:#999;margin-top:14px;">Şu an aksiyon bekleyen talep yok — hepsi onaylı/iptal.</div>';
    }

    html += `<div class="disclaimer">Durum tespiti (onaylandı/iptal/aktif), öneri metni ve gürültü işaretlemesi
      artık Claude API (Haiku) ile anlam bazlı yapılıyor - eski anahtar-kelime sistemi sadece API bir hata
      verirse yedek olarak devreye giriyor. "Kim kime yazdı" (Bizde/Otelde/Müşteride) yönü hâlâ domain bazlı,
      deterministik bir kuralla belirleniyor. Daha derinlemesine, çok adımlı bir analiz (geçmiş kayıp-müşteri
      paternleri, çapraz-otel eşleştirme, konuşma geçmişiyle bağlam) istersen chat'te "rapor" yazmaya devam
      edebilirsin.</div>`;
    content.innerHTML = html;
  } catch (e) {
    err.textContent = 'Bağlantı hatası: ' + e.message;
    content.innerHTML = '';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
</script>
</body>
</html>
