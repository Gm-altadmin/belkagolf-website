<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Rapor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Jost', Arial, sans-serif;
    background: #16211a;
    color: #f0ece2;
    margin: 0;
    padding: 40px 20px;
  }
  .box { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #c9a961;
    font-size: 2rem;
    margin-bottom: 4px;
  }
  .sub { color: #999; margin-bottom: 24px; font-size: 0.9rem; }
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    margin: 18px 0 8px; font-size: 0.82rem; color: #bbb;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .gate {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=password] {
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #3a4a3d;
    background: #1e2b23;
    color: #fff;
    width: 240px;
  }
  button {
    padding: 12px 24px;
    background: #c9a961;
    color: #16211a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover { background: #ddbf7a; }
  .err { color: #e88; margin-top: 12px; width: 100%; }
  .loading { color: #999; margin-top: 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.86rem; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #2a352d;
    vertical-align: top;
  }
  th { color: #c9a961; font-weight: 600; }
  tr:hover { background: #1e2b23; }
  .meta { color: #999; font-size: 0.85rem; margin-top: 18px; }
  .refresh-btn {
    padding: 8px 16px; font-size: 0.85rem; background: transparent;
    border: 1px solid #c9a961; color: #c9a961; margin-top: 16px;
  }
  .refresh-btn:hover { background: #c9a96122; }
  .oneri { color: #ddbf7a; font-weight: 500; }
  .status-label { font-size: 0.78rem; color: #999; margin-top: 4px; display: block; }
  .disclaimer {
    margin-top: 20px; padding: 12px 14px; background: #1e2b23;
    border-left: 3px solid #c9a961; font-size: 0.8rem; color: #999;
  }

  .dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 3px;
    vertical-align: middle;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .dot-yellow { background: #e8c547; }
  .dot-green  { background: #4caf7a; }
  .dot-pink   { background: #e87fa8; }
  .dot-cancel { background: #e05c5c; }
  .dot-confirm{ background: #4caf7a; border-color: #fff; }
  .dot-cancel, .dot-confirm { border-radius: 3px; }

  .merge-badge {
    display: inline-block;
    background: #3a4a3d;
    color: #c9a961;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    cursor: pointer;
    vertical-align: middle;
    user-select: none;
  }
  .merge-badge:hover { background: #4a5c4d; }
  .other-subjects {
    display: none;
    font-size: 0.75rem;
    color: #888;
    margin-top: 4px;
    line-height: 1.5;
  }
  .other-subjects.open { display: block; }
  .other-subjects div { padding: 1px 0; }

  /* SKORBORD (06.08.2026 eklendi): en üstte iki ayrı, bağımsız açılır-kapanır buton -
     biri onaylı, biri iptal olan talepler için, spor skoru gibi sayı gösteriyor. */
  .scoreboard {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 18px 0;
  }
  .score-btn {
    flex: 1;
    min-width: 220px;
    padding: 16px 20px;
    background: #1e2b23;
    border: 1px solid #3a4a3d;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }
  .score-btn:hover { background: #24322a; }
  .score-btn .label { font-size: 0.95rem; color: #ccc; display: flex; align-items: center; gap: 8px; }
  .score-btn .count {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.8rem;
    font-weight: 600;
  }
  .score-btn.confirm .count { color: #4caf7a; }
  .score-btn.cancel .count { color: #e05c5c; }
  .score-btn .arrow { font-size: 0.8rem; color: #777; transition: transform 0.15s; margin-left: 10px; }
  .score-btn.open .arrow { transform: rotate(90deg); }
  .score-section { display: none; margin-bottom: 8px; }
  .score-section.open { display: block; }

  /* Sekmeler (10.08.2026 eklendi) - Talep Raporu / Fiyat Arama */
  .tabs { display: none; gap: 8px; margin: 18px 0 20px; border-bottom: 1px solid #2a352d; }
  .tab-btn {
    background: transparent; border: none; color: #999; padding: 10px 18px;
    font-size: 0.95rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
    border-radius: 0; margin-bottom: -1px;
  }
  .tab-btn:hover { background: transparent; color: #ddd; }
  .tab-btn.active { color: #c9a961; border-bottom: 2px solid #c9a961; }
  .search-form {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px;
  }
  .search-field { display: flex; flex-direction: column; gap: 4px; }
  .search-field label { font-size: 0.78rem; color: #999; }
  .search-field input {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #3a4a3d;
    background: #1e2b23; color: #fff; font-size: 0.92rem; width: 140px;
  }
  .search-note { color: #ddbf7a; font-size: 0.85rem; margin-bottom: 12px; }
  .badge-free {
    display: inline-block; font-size: 0.7rem; background: #2a3f2f; color: #7fcf9a;
    padding: 1px 6px; border-radius: 8px; margin-right: 4px;
  }

  /* Otel/Oda Tipi seçim akordiyonları (10.08.2026 eklendi) */
  .hotel-accordion, .view-accordion {
    border: 1px solid #3a4a3d; border-radius: 8px; margin-bottom: 16px;
    background: #1e2b23; overflow: hidden;
  }
  .hotel-accordion-header, .view-accordion-header {
    padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; user-select: none; font-size: 0.9rem; color: #ddd;
  }
  .hotel-accordion-header:hover, .view-accordion-header:hover { background: #24322a; }
  .hotel-accordion-header .arrow, .view-accordion-header .arrow { color: #c9a961; transition: transform 0.15s; }
  .hotel-accordion-header.open .arrow, .view-accordion-header.open .arrow { transform: rotate(90deg); }
  .hotel-accordion-body, .view-accordion-body {
    display: none; padding: 12px 16px 16px; border-top: 1px solid #2a352d;
  }
  .hotel-accordion-body.open, .view-accordion-body.open { display: block; }
  .hotel-accordion-actions, .view-accordion-actions { margin-bottom: 10px; display: flex; gap: 14px; }
  .hotel-accordion-actions a, .view-accordion-actions a { color: #c9a961; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  .hotel-checkbox-grid, .view-checkbox-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px 16px;
  }
  .hotel-checkbox-item, .view-checkbox-item {
    display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: #ddd;
  }
  .hotel-checkbox-item input, .view-checkbox-item input { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1>Belka Golf — İç Panel</h1>
  <div class="sub">Talep Raporu ve Otel+Golf Fiyat Arama</div>

  <div id="gate" class="gate">
    <input type="password" id="pw" placeholder="Şifre" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Giriş</button>
  </div>
  <div class="err" id="err"></div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" id="tab-btn-rapor" onclick="switchTab('rapor')">Talep Raporu</button>
    <button class="tab-btn" id="tab-btn-search" onclick="switchTab('search')">Fiyat Arama</button>
  </div>

  <div id="view-rapor">
    <div id="content"></div>
  </div>

  <div id="view-search" style="display:none;">
    <div class="hotel-accordion" id="hotel-accordion">
      <div class="hotel-accordion-header" id="hotel-accordion-header" onclick="toggleHotelAccordion()">
        <span id="hotel-accordion-label">Oteller: Tümü (18)</span>
        <span class="arrow">▶</span>
      </div>
      <div class="hotel-accordion-body" id="hotel-accordion-body">
        <div class="hotel-accordion-actions">
          <a onclick="setAllHotels(true)">Tümünü Seç</a>
          <a onclick="setAllHotels(false)">Tümünü Kaldır</a>
        </div>
        <div class="hotel-checkbox-grid" id="hotel-checkbox-grid"></div>
      </div>
    </div>
    <div class="view-accordion" id="view-accordion">
      <div class="view-accordion-header" id="view-accordion-header" onclick="toggleViewAccordion()">
        <span id="view-accordion-label">Oda Tipi: Tümü</span>
        <span class="arrow">▶</span>
      </div>
      <div class="view-accordion-body" id="view-accordion-body">
        <div class="view-accordion-actions">
          <a onclick="setAllViews(true)">Tümünü Seç</a>
          <a onclick="setAllViews(false)">Tümünü Kaldır</a>
        </div>
        <div class="view-checkbox-grid" id="view-checkbox-grid"></div>
      </div>
    </div>
    <div class="search-form">
      <div class="search-field">
        <label>Giriş Tarihi</label>
        <input type="date" id="s-date">
      </div>
      <div class="search-field">
        <label>Gece Sayısı</label>
        <input type="number" id="s-nights" placeholder="örn. 7" min="1">
      </div>
      <div class="search-field">
        <label>Round Sayısı</label>
        <input type="text" id="s-rounds" placeholder="örn. 3 veya Sınırsız">
      </div>
      <div class="search-field">
        <label>Kişi Sayısı</label>
        <input type="number" id="s-pax" placeholder="2" min="1" value="2">
      </div>
      <button onclick="runHotelSearch()">Ara</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script>
const DOT_LABEL = {
  yellow: 'sarı', green: 'yeşil', pink: 'pembe', cancel: 'iptal', confirm: 'onay'
};

// Şifre girişten sonra hem rapor hem fiyat-arama sekmesi tarafından kullanılıyor.
let SAVED_PW = '';

async function doLogin() {
  SAVED_PW = document.getElementById('pw').value;
  await loadReport();
  // loadReport hata vermediyse (401/err boşsa) şifre doğrudur - sekmeleri göster.
  if (!document.getElementById('err').textContent) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('tabs').style.display = 'flex';
  }
}

function switchTab(name) {
  const isRapor = name === 'rapor';
  document.getElementById('view-rapor').style.display = isRapor ? 'block' : 'none';
  document.getElementById('view-search').style.display = isRapor ? 'none' : 'block';
  document.getElementById('tab-btn-rapor').classList.toggle('active', isRapor);
  document.getElementById('tab-btn-search').classList.toggle('active', !isRapor);
}

function fmtEuro(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString('tr-TR') + ' €';
}

// Otel seçim akordiyonu (10.08.2026 eklendi) - 18 otel, varsayılan hepsi seçili.
const ALL_HOTELS = [
  'Maxx Royal Belek Golf Resort', 'Cornelia Diamond Golf Resort & Spa',
  'Regnum Carya Golf & Spa', 'Regnum The Crown', 'Cullinan Belek',
  'Sueno Hotels Golf Belek', 'Sueno Hotels DeLuxe Belek',
  'Kaya Palazzo Golf Resort & Spa', 'Kaya Belek Hotel',
  'Titanic Deluxe Golf Belek', 'Gloria Serenity Resort', 'Gloria Golf Resort',
  'Gloria Verde Resort & Spa', 'Lykia World Antalya', 'Kempinski Hotel The Dome',
  'Robinson Club Nobilis', 'Sirene Belek Golf Hotel', 'Voyage Belek Golf & Spa'
];

function buildHotelCheckboxes() {
  const grid = document.getElementById('hotel-checkbox-grid');
  grid.innerHTML = ALL_HOTELS.map((h, i) => `
    <label class="hotel-checkbox-item">
      <input type="checkbox" class="hotel-cb" value="${escapeHtml(h)}" checked onchange="updateHotelAccordionLabel()">
      ${escapeHtml(h)}
    </label>`).join('');
}

function toggleHotelAccordion() {
  document.getElementById('hotel-accordion-header').classList.toggle('open');
  document.getElementById('hotel-accordion-body').classList.toggle('open');
}

function setAllHotels(checked) {
  document.querySelectorAll('.hotel-cb').forEach(cb => cb.checked = checked);
  updateHotelAccordionLabel();
}

function getSelectedHotels() {
  return Array.from(document.querySelectorAll('.hotel-cb')).filter(cb => cb.checked).map(cb => cb.value);
}

function updateHotelAccordionLabel() {
  const selected = getSelectedHotels();
  const label = document.getElementById('hotel-accordion-label');
  if (selected.length === ALL_HOTELS.length) {
    label.textContent = 'Oteller: Tümü (18)';
  } else if (selected.length === 0) {
    label.textContent = 'Oteller: Hiçbiri seçili değil';
  } else {
    label.textContent = `Oteller: ${selected.length} seçili`;
  }
}

buildHotelCheckboxes();

// Oda tipi seçim akordiyonu (10.08.2026 eklendi) - hotel-packages.xlsx'te geçen
// tüm "Oda Görünümü" değerleri + görünüm belirtilmemiş oteller için özel seçenek.
const NONE_VIEW = '__NONE__';
const ALL_VIEWS = [
  'Land View', 'Golf View', 'Sea View', 'Side Sea View', 'Deluxe Sea View',
  'Garden View', 'Standard Room', 'Superior Room', 'Superior Room Sea View',
  'Superior Side Sea View', 'Suite Sea View', 'Sea View / Deluxe Junior Suite',
  'Luxury Lagoon Suite', NONE_VIEW
];
const VIEW_LABELS = { [NONE_VIEW]: 'Görünüm Belirtilmemiş (tek kategori)' };

function buildViewCheckboxes() {
  const grid = document.getElementById('view-checkbox-grid');
  grid.innerHTML = ALL_VIEWS.map(v => `
    <label class="view-checkbox-item">
      <input type="checkbox" class="view-cb" value="${escapeHtml(v)}" checked onchange="updateViewAccordionLabel()">
      ${escapeHtml(VIEW_LABELS[v] || v)}
    </label>`).join('');
}

function toggleViewAccordion() {
  document.getElementById('view-accordion-header').classList.toggle('open');
  document.getElementById('view-accordion-body').classList.toggle('open');
}

function setAllViews(checked) {
  document.querySelectorAll('.view-cb').forEach(cb => cb.checked = checked);
  updateViewAccordionLabel();
}

function getSelectedViews() {
  return Array.from(document.querySelectorAll('.view-cb')).filter(cb => cb.checked).map(cb => cb.value);
}

function updateViewAccordionLabel() {
  const selected = getSelectedViews();
  const label = document.getElementById('view-accordion-label');
  if (selected.length === ALL_VIEWS.length) {
    label.textContent = 'Oda Tipi: Tümü';
  } else if (selected.length === 0) {
    label.textContent = 'Oda Tipi: Hiçbiri seçili değil';
  } else {
    label.textContent = `Oda Tipi: ${selected.length} seçili`;
  }
}

buildViewCheckboxes();

async function runHotelSearch() {
  const date = document.getElementById('s-date').value;
  const nights = document.getElementById('s-nights').value;
  const rounds = document.getElementById('s-rounds').value;
  const pax = document.getElementById('s-pax').value;
  const box = document.getElementById('search-results');

  const selectedHotels = getSelectedHotels();
  const selectedViews = getSelectedViews();
  if (selectedHotels.length === 0) {
    box.innerHTML = '<div class="err">En az bir otel seçili olmalı.</div>';
    return;
  }
  if (selectedViews.length === 0) {
    box.innerHTML = '<div class="err">En az bir oda tipi seçili olmalı.</div>';
    return;
  }
  if (!date) {
    box.innerHTML = '<div class="err">Giriş tarihi zorunlu.</div>';
    return;
  }
  box.innerHTML = '<div class="loading">Aranıyor...</div>';

  try {
    const params = new URLSearchParams({ password: SAVED_PW, date });
    if (nights) params.set('nights', nights);
    if (rounds) params.set('rounds', rounds);
    if (pax) params.set('pax', pax);
    if (selectedHotels.length < ALL_HOTELS.length) {
      params.set('hotels', selectedHotels.join('|'));
    }
    if (selectedViews.length < ALL_VIEWS.length) {
      params.set('views', selectedViews.join('|'));
    }

    const res = await fetch('/api/hotelsearch?' + params.toString());
    const data = await res.json();

    if (res.status === 401) {
      box.innerHTML = '<div class="err">Şifre hatalı — sayfayı yenileyip tekrar giriş yapın.</div>';
      return;
    }
    if (data.error) {
      box.innerHTML = '<div class="err">Hata: ' + escapeHtml(data.error) + '</div>';
      return;
    }

    let html = '';
    if (data.fallbackNote) {
      html += `<div class="search-note">⚠️ ${escapeHtml(data.fallbackNote)}</div>`;
    }
    html += `<div class="meta">${data.count} sonuç — en ucuzdan pahalıya sıralı</div>`;

    if (data.results.length === 0) {
      html += '<div style="color:#999;margin-top:14px;">Bu tarih için hiçbir otelde uygun paket bulunamadı.</div>';
    } else {
      html += '<table><tr><th>Otel</th><th>Görünüm</th><th>Gece</th><th>Round</th><th>Tekil</th><th>Çift/Kişi</th><th>7+1/Kişi</th><th>Dahil</th></tr>';
      for (const r of data.results) {
        const badges = [
          r.buggyFree ? '<span class="badge-free">Buggy</span>' : '',
          r.tokenFree ? '<span class="badge-free">Token</span>' : '',
          r.transferFree ? '<span class="badge-free">Transfer</span>' : ''
        ].join('');
        html += `<tr>
          <td>${escapeHtml(r.hotel)}</td>
          <td>${escapeHtml(r.view || '—')}</td>
          <td>${r.nights}</td>
          <td>${escapeHtml(String(r.rounds))}</td>
          <td>${fmtEuro(r.single)}</td>
          <td>${fmtEuro(r.double)}</td>
          <td>${fmtEuro(r.group71)}</td>
          <td>${badges || '—'}</td>
        </tr>`;
      }
      html += '</table>';
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="err">Bağlantı hatası: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderTrail(trail) {
  return trail.map(c => `<span class="dot dot-${c}" title="${DOT_LABEL[c] || c}"></span>`).join('');
}

function toggleOther(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// Skorbord butonlarını aç/kapa (06.08.2026 eklendi).
function toggleScore(kind) {
  const section = document.getElementById('score-section-' + kind);
  const btn = document.getElementById('score-btn-' + kind);
  if (section) section.classList.toggle('open');
  if (btn) btn.classList.toggle('open');
}

function isConfirmed(item) {
  return (item.statusLabel || '').indexOf('Kabul Edildi') === 0;
}
function isCancelled(item) {
  return (item.statusLabel || '').indexOf('Reddedildi') === 0;
}

function buildRow(item, rowIdx) {
  // Saat eklendi (10.08.2026) - hangi mailin önce geldiğini ayırt etmek için tarihin
  // yanında saat de gösteriliyor artık.
  const d = item.date ? new Date(item.date).toLocaleDateString('tr-TR') + ' ' + new Date(item.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
  const lateStyle = item.isLate ? ' style="background:rgba(224,92,92,0.1);border-left:3px solid #e05c5c;"' : '';

  const mergeCount = item.mergedCount || 1;
  let mergeBadge = '';
  let otherSubjectsHtml = '';
  if (mergeCount > 1) {
    const othersId = 'others-' + rowIdx;
    mergeBadge = `<span class="merge-badge" onclick="toggleOther('${othersId}')" title="Tıkla: diğer ${mergeCount - 1} mail'i göster/gizle">×${mergeCount}</span>`;
    if (item.otherSubjects && item.otherSubjects.length) {
      otherSubjectsHtml = `<div class="other-subjects" id="${othersId}">${
        item.otherSubjects.map(s => '<div>· ' + escapeHtml(s) + '</div>').join('')
      }</div>`;
    }
  }

  return `<tr${lateStyle}>
    <td>${d}</td>
    <td>${escapeHtml(item.from)}</td>
    <td>${escapeHtml(item.subject)}${mergeBadge}${otherSubjectsHtml}</td>
    <td>${escapeHtml(item.snippet).slice(0, 120)}${item.snippet.length > 120 ? '…' : ''}</td>
    <td>${renderTrail(item.trail)}<span class="status-label">${escapeHtml(item.statusLabel)}</span></td>
    <td class="oneri">${escapeHtml(item.oneri)}</td>
  </tr>`;
}

function buildTable(items, startIdx) {
  let rowIdx = startIdx;
  let html = '<table><tr><th>Tarih / Saat</th><th>Kimden</th><th>Konu</th><th>Özet</th><th>İz / Durum</th><th>Öneri</th></tr>';
  for (const item of items) {
    rowIdx++;
    html += buildRow(item, 'r' + rowIdx);
  }
  html += '</table>';
  return { html, nextIdx: rowIdx };
}

async function loadReport() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const content = document.getElementById('content');
  err.textContent = '';
  content.innerHTML = '<div class="loading">Yükleniyor...</div>';

  try {
    const res = await fetch('/api/rapor?password=' + encodeURIComponent(pw));
    const data = await res.json();

    if (res.status === 401) {
      err.textContent = 'Şifre hatalı.';
      content.innerHTML = '';
      return;
    }
    if (data.error) {
      err.textContent = 'Hata: ' + data.error;
      content.innerHTML = '';
      return;
    }

    // SKORBORD (06.08.2026): onaylı ve iptal olan talepler ayrı ayrı sayılıp, en üstte
    // iki bağımsız skor butonu olarak gösteriliyor - her biri kendi listesini açar.
    const confirmedItems = data.items.filter(isConfirmed);
    const cancelledItems = data.items.filter(isCancelled);
    const activeItems = data.items.filter(it => !isConfirmed(it) && !isCancelled(it));

    let rowCounter = 0;

    let html = `<div class="meta">Son güncelleme: ${new Date(data.generatedAt).toLocaleString('tr-TR')}
      — ${data.count} talep bulundu — en öncelikli üstte</div>`;
    html += '<button class="refresh-btn" onclick="loadReport()">Yenile</button>';

    // Skorbord
    html += `<div class="scoreboard">
      <div class="score-btn confirm" id="score-btn-confirm" onclick="toggleScore('confirm')">
        <span class="label"><span class="dot dot-confirm"></span> Onaylı</span>
        <span class="count">${confirmedItems.length}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="score-btn cancel" id="score-btn-cancel" onclick="toggleScore('cancel')">
        <span class="label"><span class="dot dot-cancel"></span> İptal</span>
        <span class="count">${cancelledItems.length}</span>
        <span class="arrow">▶</span>
      </div>
    </div>`;

    const confirmedTable = buildTable(confirmedItems, rowCounter);
    rowCounter = confirmedTable.nextIdx;
    html += `<div class="score-section" id="score-section-confirm">${confirmedTable.html}</div>`;

    const cancelledTable = buildTable(cancelledItems, rowCounter);
    rowCounter = cancelledTable.nextIdx;
    html += `<div class="score-section" id="score-section-cancel">${cancelledTable.html}</div>`;

    html += `<div class="legend">
      <span class="legend-item"><span class="dot dot-yellow"></span> bize gelen (top bizde)</span>
      <span class="legend-item"><span class="dot dot-green"></span> biz → otel (top otelde)</span>
      <span class="legend-item"><span class="dot dot-pink"></span> biz → müşteri (top müşteride)</span>
      <span class="legend-item"><span class="merge-badge">×N</span> aynı müşterinin N mail'i birleşti — tıkla, aç/kapa</span>
    </div>
    <div style="color:#777;font-size:0.78rem;margin-bottom:8px;">Noktalar solda eskiden yeniye sıralanır - sağdaki en güncel durum. Aşağıdaki liste sadece aksiyon bekleyen talepleri gösterir.</div>`;

    const activeTable = buildTable(activeItems, rowCounter);
    html += activeTable.html;

    if (activeItems.length === 0) {
      html += '<div style="color:#999;margin-top:14px;">Şu an aksiyon bekleyen talep yok — hepsi onaylı/iptal.</div>';
    }

    html += `<div class="disclaimer">Bu sayfa anahtar-kelime ve "kim kime yazdı" (domain bazlı) kurallarla çalışır.
      Chat'teki "rapor" komutunun yaptığı derinlemesine analiz (tam bağlam okuma,
      geçmiş kayıp-müşteri paternleri, çapraz-otel eşleştirme) burada yok — en doğru/detaylı
      analiz için chat'te "rapor" yazmaya devam edin.</div>`;
    content.innerHTML = html;
  } catch (e) {
    err.textContent = 'Bağlantı hatası: ' + e.message;
    content.innerHTML = '';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
</script>
</body>
</html>
